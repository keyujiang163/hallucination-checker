<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 防幻觉核查工具</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; max-width: 960px; margin: 32px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { margin-bottom: 8px; }
    .subtitle { color: #666; margin-bottom: 24px; }
    textarea { width: 100%; min-height: 120px; padding: 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; resize: vertical; font-family: inherit; }
    button { margin-top: 12px; padding: 10px 20px; background: #2563eb; color: white; border: 0; border-radius: 6px; font-size: 14px; cursor: pointer; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    @media (max-width: 600px) { button { width: 100%; } }
    .status { margin: 16px 0; color: #555; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border: 1px solid #e5e7eb; padding: 10px; text-align: left; vertical-align: top; font-size: 14px; }
    th { background: #f3f4f6; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge.verified { background: #d1fae5; color: #065f46; }
    .badge.unverified { background: #fee2e2; color: #991b1b; }
    .badge.unknown { background: #f3f4f6; color: #374151; }
    .summary { margin: 16px 0; padding: 12px; background: #f9fafb; border-radius: 6px; }
    .example { color: #2563eb; cursor: pointer; text-decoration: underline; margin-right: 12px; font-size: 13px; }
    #quota-banner { display: inline-block; padding: 6px 14px; margin-bottom: 18px; border-radius: 999px; font-size: 13px; font-weight: 600; background: linear-gradient(135deg, #1e293b, #334155); color: #e2e8f0; border: 1px solid #475569; box-shadow: 0 1px 4px rgba(0,0,0,0.08); transition: background 0.25s ease, color 0.25s ease; }
    #quota-banner.warn { background: linear-gradient(135deg, #92400e, #c2410c); color: #ffedd5; border-color: #c2410c; }
    #quota-banner.over { background: linear-gradient(135deg, #7f1d1d, #b91c1c); color: #fee2e2; border-color: #b91c1c; }
    #quota-banner .label { opacity: 0.8; margin-right: 4px; font-weight: 500; }
  </style>
</head>
<body>
  <h1>🛡️ AI 防幻觉核查工具</h1>
  <div class="subtitle">把 AI 回答贴进来,自动拆事实点 + 联网核查,标红标绿。</div>
  <div id="quota-banner"><span class="label">今日用量</span><span id="quota-used">0</span> / <span id="quota-limit">50</span> · 免费版</div>

  <textarea id="input" placeholder="例如:珠穆朗玛峰高 8848 米,长江是亚洲最长的河流,牛顿在 1900 年发明了电话..." onkeydown="if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();document.getElementById('submitBtn').click();}"></textarea>
  <div>
    <span class="example" data-text="珠穆朗玛峰高 8848 米,是中国和尼泊尔的边境。">示例 1</span>
    <span class="example" data-text="爱因斯坦在 1921 年获得诺贝尔物理学奖,水星的表面温度约为 427°C。">示例 2</span>
  </div>
  <button id="submitBtn">开始核查</button>
  <div class="status" id="status"></div>

  <div id="summary"></div>
  <table id="resultTable" style="display:none;">
    <thead>
      <tr><th style="width:50%">事实点 (Claim)</th><th style="width:15%">状态</th><th style="width:35%">证据</th></tr>
    </thead>
    <tbody id="resultBody"></tbody>
  </table>

  <script>
    const input = document.getElementById('input');
    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    const table = document.getElementById('resultTable');
    const tbody = document.getElementById('resultBody');
    const summary = document.getElementById('summary');

    document.querySelectorAll('.example').forEach(el => {
      el.addEventListener('click', () => { input.value = el.dataset.text; });
    });

    function badgeClass(s) { return 'badge ' + s; }
    function badgeText(s) {
      if (s === 'verified') return '✅ 绿-有证据';
      if (s === 'unverified') return '🔴 红-无证据';
      return '⚪ 未知';
    }

    const banner = document.getElementById('quota-banner');
    const qUsed = document.getElementById('quota-used');
    const qLimit = document.getElementById('quota-limit');
    function paintBanner(used, limit) {
      qUsed.textContent = String(used);
      qLimit.textContent = String(limit);
      const ratio = limit > 0 ? used / limit : 1;
      banner.classList.toggle('warn', ratio >= 0.6 && ratio < 1);
      banner.classList.toggle('over', ratio >= 1);
    }
    async function refreshAccount() {
      try {
        const r = await fetch('/api/account');
        if (!r.ok) return;
        const a = await r.json();
        paintBanner(a.quota_used || 0, a.quota_limit || 50);
      } catch (_) {}
    }
    refreshAccount();

    btn.addEventListener('click', async () => {
      const text = input.value.trim();
      if (!text) { status.textContent = '请输入内容'; return; }
      const originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = '核查中...';
      status.textContent = '正在拆事实点 + 联网核查 (最多 ~10 秒)...';
      table.style.display = 'none';
      summary.innerHTML = '';
      tbody.innerHTML = '';
      try {
        const resp = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const rem = resp.headers.get('X-RateLimit-Remaining');
        const lim = resp.headers.get('X-RateLimit-Limit');
        if (lim) {
          const limit = parseInt(lim, 10) || 50;
          const remaining = rem !== null ? parseInt(rem, 10) : 0;
          paintBanner(Math.max(0, limit - remaining), limit);
        }
        const data = await resp.json();
        if (!resp.ok) { status.textContent = '错误: ' + (data.error || resp.statusText); return; }
        const results = data.results || [];
        if (results.length === 0) { status.textContent = data.note || '未拆出事实点'; return; }
        status.textContent = '核查完成,共 ' + results.length + ' 条事实点';
        const verified = results.filter(r => r.status === 'verified').length;
        const unverified = results.filter(r => r.status === 'unverified').length;
        const unknown = results.filter(r => r.status === 'unknown').length;
        summary.innerHTML = '<div class="summary">✅ 有证据 ' + verified + ' 条 · 🔴 无证据 ' + unverified + ' 条 · ⚪ 未知 ' + unknown + ' 条</div>';
        results.forEach(r => {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td>' + r.claim + '</td><td><span class="' + badgeClass(r.status) + '">' + badgeText(r.status) + '</span></td><td>' + (r.evidence || '-') + '</td>';
          tbody.appendChild(tr);
        });
        table.style.display = '';
      } catch (err) {
        status.textContent = '网络错误: ' + err.message + ' (请检查海外部署或代理)';
      } finally {
        btn.disabled = false;
        btn.textContent = originalLabel;
      }
    });
  </script>
</body>
</html>
